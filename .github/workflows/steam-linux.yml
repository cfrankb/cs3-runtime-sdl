name: Build Steam Linux Version

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Run all steps inside the Sniper SDK container
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive # Important if you bake in SDL/zlib

      - name: Checkout Data Repo
        uses: actions/checkout@v6
        with:
          repository: cfrankb/cs3-data-private
          path: data
          token: ${{ secrets.CS3_REPO_TOKEN }}

      - name: Checkout Steamworks SDK
        uses: actions/checkout@v6
        with:
          repository: cfrankb/steamworks-sdk-private
          path: external/steamworks/sdk
          token: ${{ secrets.CS3_REPO_TOKEN }}

      #- name: Configure CMake
      #  run: |
      #    cmake -B build \
      #      -DCMAKE_BUILD_TYPE=Release \
      #      -DBUILDING_FOR_STEAM=ON

      - name: Build
        #run: cmake --build build --config Release
        run: |
          pwd
          ls -l
          ls -l external
          ls -l external/steamworks/sdk/public/steam
          python3 bin/refresh.py
          chmod +x bin/build.sh
          bin/build.sh steam_linux

      - name: Setup
        run: |
          mkdir setup
          copy build/steam-linux/cs3-runtime setup
          copy external/steamworks/sdk/redistributable_bin/linux64/libsteam_api.so setup
          copy packages/steam/steam_appid.txt setup
          copy -r data setup

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-linux-build
          path: |
            setup
          retention-days: 7
